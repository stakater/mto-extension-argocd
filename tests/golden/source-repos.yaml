---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    templates.v2.stakater.com/deletion-policy: Orphan
  name: patterned
  namespace: openshift-gitops
spec:
  description: Managed by mto-extension-argocd
  destinations:
    - namespace: patterned-dev
      server: https://kubernetes.default.svc
  roles:
    - description: Role that gives full access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - patterned-owner-group-33c9d2
      name: patterned-owner
      policies:
        - p, proj:patterned:patterned-owner, applications, *, patterned/*, allow
        - p, proj:patterned:patterned-owner, applicationsets, *, patterned/*, allow
        - p, proj:patterned:patterned-owner, logs, get, patterned/*, allow
        - p, proj:patterned:patterned-owner, repositories, *, patterned/*, allow
        - p, proj:patterned:patterned-owner, clusters, get, patterned/*, allow
    - description: Role that gives edit access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - patterned-edit-group-36a6a0
      name: patterned-edit
      policies:
        - p, proj:patterned:patterned-edit, applications, get, patterned/*, allow
        - p, proj:patterned:patterned-edit, applications, sync, patterned/*, allow
        - p, proj:patterned:patterned-edit, applications, update, patterned/*, allow
        - p, proj:patterned:patterned-edit, applications, update/*, patterned/*, allow
        - p, proj:patterned:patterned-edit, applications, action/*, patterned/*, allow
        - p, proj:patterned:patterned-edit, applicationsets, get, patterned/*, allow
        - p, proj:patterned:patterned-edit, logs, get, patterned/*, allow
        - p, proj:patterned:patterned-edit, repositories, get, patterned/*, allow
        - p, proj:patterned:patterned-edit, clusters, get, patterned/*, allow
    - description: Role that gives view access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - patterned-view-group-816b39
      name: patterned-view
      policies:
        - p, proj:patterned:patterned-view, applications, get, patterned/*, allow
        - p, proj:patterned:patterned-view, applicationsets, get, patterned/*, allow
        - p, proj:patterned:patterned-view, logs, get, patterned/*, allow
        - p, proj:patterned:patterned-view, repositories, get, patterned/*, allow
        - p, proj:patterned:patterned-view, clusters, get, patterned/*, allow
  sourceRepos:
    - https://github.com/acme/patterned-gitops
    - https://github.com/acme/patterned-charts
---
