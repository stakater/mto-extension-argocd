---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    templates.v2.stakater.com/deletion-policy: Orphan
  name: patterned
  namespace: openshift-gitops
spec:
  description: Managed by mto-extension-argocd
  destinations:
    - namespace: patterned-dev
      server: https://kubernetes.default.svc
    - namespace: openshift-gitops
      server: https://kubernetes.default.svc
  roles:
    - description: Role that gives full access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - patterned-owner-group-33c9d2
      name: patterned-owner
      policies:
        - p, proj:patterned:patterned-owner, *, *, patterned/*, allow
    - description: Role that gives edit access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - patterned-edit-group-36a6a0
      name: patterned-edit
      policies:
        - p, proj:patterned:patterned-edit, *, *, patterned/*, allow
    - description: Role that gives view access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - patterned-view-group-816b39
      name: patterned-view
      policies:
        - p, proj:patterned:patterned-view, *, get, patterned/*, allow
  sourceRepos:
    - https://github.com/acme/patterned-gitops
