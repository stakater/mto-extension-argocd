---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    templates.v2.stakater.com/deletion-policy: Orphan
  name: shares-argo-ns
  namespace: openshift-gitops
spec:
  description: Managed by mto-extension-argocd
  destinations:
    - namespace: shares-argo-ns-dev
      server: https://kubernetes.default.svc
    - namespace: openshift-gitops
      server: https://kubernetes.default.svc
  roles:
    - description: Role that gives full access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - shares-argo-ns-owner-group-7f194a
        - ops@example.com
      name: shares-argo-ns-owner
      policies:
        - p, proj:shares-argo-ns:shares-argo-ns-owner, *, *, shares-argo-ns/*, allow
    - description: Role that gives edit access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - shares-argo-ns-edit-group-a20c52
      name: shares-argo-ns-edit
      policies:
        - p, proj:shares-argo-ns:shares-argo-ns-edit, *, *, shares-argo-ns/*, allow
    - description: Role that gives view access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - shares-argo-ns-view-group-6a5bd7
      name: shares-argo-ns-view
      policies:
        - p, proj:shares-argo-ns:shares-argo-ns-view, *, get, shares-argo-ns/*, allow
