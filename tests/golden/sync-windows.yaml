      groups:
        - inherits-view-group-41cc4a
      name: inherits-view
      policies:
        - p, proj:inherits:inherits-view, applications, get, inherits/*, allow
        - p, proj:inherits:inherits-view, applicationsets, get, inherits/*, allow
        - p, proj:inherits:inherits-view, logs, get, inherits/*, allow
        - p, proj:inherits:inherits-view, repositories, get, inherits/*, allow
        - p, proj:inherits:inherits-view, clusters, get, inherits/*, allow
