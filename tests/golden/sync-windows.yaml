    templates.v2.stakater.com/deletion-policy: Orphan
  name: inherits
  namespace: openshift-gitops
spec:
  description: Managed by mto-extension-argocd
  destinations: []
  orphanedResources:
    warn: true
  roles:
    - description: Role that gives full access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - inherits-owner-group-298e54
      name: inherits-owner
      policies:
        - p, proj:inherits:inherits-owner, applications, *, inherits/*, allow
