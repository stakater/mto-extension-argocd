      groups:
        - inherits-edit-group-b029c5
      name: inherits-edit
      policies:
        - p, proj:inherits:inherits-edit, applications, get, inherits/*, allow
        - p, proj:inherits:inherits-edit, applications, sync, inherits/*, allow
        - p, proj:inherits:inherits-edit, applications, update, inherits/*, allow
        - p, proj:inherits:inherits-edit, applications, update/*, inherits/*, allow
        - p, proj:inherits:inherits-edit, applications, action/*, inherits/*, allow
        - p, proj:inherits:inherits-edit, applicationsets, get, inherits/*, allow
