---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    templates.v2.stakater.com/deletion-policy: Orphan
  name: inherit
  namespace: openshift-gitops
spec:
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: tronador.stakater.com
      kind: EnvironmentProvisioner
  description: Managed by mto-extension-argocd
  destinations:
    - namespace: inherit-dev
      server: https://kubernetes.default.svc
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
  roles:
    - description: Role that gives full access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - inherit-owner-group-2ab618
        - inherit-owners
      name: inherit-owner
      policies:
        - p, proj:inherit:inherit-owner, applications, *, inherit/*, allow
        - p, proj:inherit:inherit-owner, applicationsets, *, inherit/*, allow
        - p, proj:inherit:inherit-owner, logs, get, inherit/*, allow
        - p, proj:inherit:inherit-owner, repositories, *, inherit/*, allow
        - p, proj:inherit:inherit-owner, clusters, get, inherit/*, allow
    - description: Role that gives edit access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - inherit-edit-group-afec3d
      name: inherit-edit
      policies:
        - p, proj:inherit:inherit-edit, applications, get, inherit/*, allow
        - p, proj:inherit:inherit-edit, applications, sync, inherit/*, allow
        - p, proj:inherit:inherit-edit, applications, update, inherit/*, allow
        - p, proj:inherit:inherit-edit, applications, update/*, inherit/*, allow
        - p, proj:inherit:inherit-edit, applications, action/*, inherit/*, allow
        - p, proj:inherit:inherit-edit, applicationsets, get, inherit/*, allow
        - p, proj:inherit:inherit-edit, logs, get, inherit/*, allow
        - p, proj:inherit:inherit-edit, repositories, get, inherit/*, allow
        - p, proj:inherit:inherit-edit, clusters, get, inherit/*, allow
    - description: Role that gives view access to all resources inside the tenant's namespace to the tenant owner group
      groups:
        - inherit-view-group-87e8be
      name: inherit-view
      policies:
        - p, proj:inherit:inherit-view, applications, get, inherit/*, allow
        - p, proj:inherit:inherit-view, applicationsets, get, inherit/*, allow
        - p, proj:inherit:inherit-view, logs, get, inherit/*, allow
        - p, proj:inherit:inherit-view, repositories, get, inherit/*, allow
        - p, proj:inherit:inherit-view, clusters, get, inherit/*, allow
