# Two destination edge cases that are easy to get wrong and invisible in a
# normal cluster.
#
#   shares-argo-ns  The ArgoCD namespace itself carries this tenant's label and
#                   is not privileged. It is still NOT a destination (#6): a
#                   tenant that can deploy into the control plane can reach
#                   ArgoCD admin. With argocd.allowControlPlaneDestination it
#                   would appear exactly once (legacy-compatible.yaml pins that).
#
#   no-namespaces   A tenant with zero labelled namespaces still gets an
#                   AppProject, now with no destinations at all, rendered as
#                   `destinations: []` rather than null. It must NOT be
#                   skipped: skipping would silently remove a real tenant's
#                   AppProject the moment its last namespace went away.
#
#   The empty list also has to survive as JSON: a comma-joined empty list would
#   be "", which ResolveParameterValue treats as unset and rejects outright.

values:
  argocd:
    namespace: openshift-gitops
  scaffolding:
    mode: Always

cluster:
  integrationConfig:
    accessControl:
      privileged:
        namespaces: []
        groups: []

  tenants:
    - metadata:
        name: shares-argo-ns
      spec:
        accessControl:
          owners: { users: [ops@example.com] }
    - metadata:
        name: no-namespaces
      spec:
        accessControl:
          owners: { users: [ops@example.com] }

  namespaces:
    - metadata: { name: shares-argo-ns-dev, labels: { stakater.com/tenant: shares-argo-ns } }
    - metadata: { name: openshift-gitops, labels: { stakater.com/tenant: shares-argo-ns } }
