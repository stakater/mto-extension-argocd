# sourceRepos resolution.
#
# There is no safe shared default for sourceRepos: one org-wide value lets
# every tenant deploy from every other tenant's repos. The only shareable form
# is a pattern templated on the tenant name, which is what this pins.
#
#   patterned     the chart's pattern list, each entry with {{ tenant }}
#                 expanded, one sourceRepos entry per pattern, in order.
#   overridden    the Tenant's own annotation wins outright -- no merge with
#                 the pattern, or a tenant could never narrow its own access.
#   emptied       an explicit "[]" yields no sourceRepos field at all, which
#                 is how a tenant opts out of a pattern the platform team set.
#   empty-string  "" is the near-miss of "[]", and it must fail THIS child
#                 loudly rather than silently fall back to expanding the
#                 pattern -- the author plainly meant to override something.
#
# The "neither pattern nor annotation" case is covered by privileged.yaml,
# whose golden carries no sourceRepos key. That is the shipping default, and it
# is empty on purpose: a shipped pattern would add a field to every existing
# AppProject that did not have one, breaking the migration diff against the
# old controller's output.
#
# The wrong-placeholder case ({{ .tenant }}) is not here because it cannot get
# this far -- _helpers.tpl refuses it at helm install time. See
# TestSourceReposPatternRejectsUnknownPlaceholder.

values:
  argocd:
    namespace: openshift-gitops
    sourceRepos:
      pattern:
        - https://github.com/acme/{{ tenant }}-gitops
        - https://github.com/acme/{{ tenant }}-charts
  scaffolding:
    mode: Always

expectChildErrors:
  mto-argocd-tenant-empty-string: "unexpected end of JSON input"

cluster:
  integrationConfig:
    accessControl:
      privileged:
        namespaces: []
        groups: []

  tenants:
    - metadata:
        name: patterned
      spec: {}

    - metadata:
        name: overridden
        annotations:
          argocd.tenantoperator.stakater.com/source-repos: '["https://gitlab.example.com/team/apps.git","https://github.com/acme/shared-lib"]'
      spec: {}

    - metadata:
        name: emptied
        annotations:
          argocd.tenantoperator.stakater.com/source-repos: "[]"
      spec: {}

    - metadata:
        name: empty-string
        annotations:
          argocd.tenantoperator.stakater.com/source-repos: ""
      spec: {}

  namespaces:
    - metadata: { name: patterned-dev, labels: { stakater.com/tenant: patterned } }
    - metadata: { name: overridden-dev, labels: { stakater.com/tenant: overridden } }
    - metadata: { name: emptied-dev, labels: { stakater.com/tenant: emptied } }
    - metadata: { name: empty-string-dev, labels: { stakater.com/tenant: empty-string } }
