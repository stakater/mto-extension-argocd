# A Tenant that actually works with this chart.
#
# The thing most likely to be got wrong is access: it is possible to create a
# tenant whose AppProject looks correct and grants ArgoCD access to nobody. See
# the "groups vs users" note below -- that is not hypothetical, it is the state
# of a real tenant on our test cluster today.
---
apiVersion: tenantoperator.stakater.com/v1beta3
kind: Tenant
metadata:
  name: acme
  annotations:
    # ---------------------------------------------------------------- opt in
    # Required unless the chart runs with scaffolding.mode: Always. Must be
    # exactly "true" -- "True", "yes" and "1" all read as opted OUT, and
    # removing this annotation DELETES the tenant's AppProject.
    argocd.tenantoperator.stakater.com/enabled: "true"

    # ------------------------------------------------------------ overrides
    # All four are optional. Absent inherits the chart default; an explicit []
    # overrides with empty, which is a different thing. Malformed JSON fails
    # this tenant's child and nothing else -- it never silently falls back.

    # Repositories this tenant's Applications may deploy from.
    #
    # WITHOUT THIS (and without a chart-wide sourceRepos.pattern) the tenant
    # can deploy NOTHING. An AppProject with no sourceRepos permits no
    # repository at all, and ArgoCD rejects every Application with
    # "application repo ... is not permitted in project". Verified on a live
    # cluster. Set it here, or set argocd.sourceRepos.pattern in chart values
    # so every tenant gets one derived from its name.
    argocd.tenantoperator.stakater.com/source-repos: |
      ["https://github.com/acme/acme-gitops"]

    # Cluster-scoped kinds this tenant's Applications may manage. JSON array of
    # {group, kind}. Omit to inherit argocd.clusterResourceWhitelist.
    argocd.tenantoperator.stakater.com/cluster-resource-whitelist: |
      [{"group":"","kind":"Namespace"}]

    # Namespaced kinds this tenant's Applications may NOT manage. An explicit
    # [] here means "no restrictions for this tenant", overriding the chart
    # default rather than inheriting it.
    argocd.tenantoperator.stakater.com/namespace-resource-blacklist: |
      [{"group":"","kind":"ResourceQuota"}]

    # Whether deleting this Tenant also deletes its AppProject. Must be exactly
    # "true" or "false" -- anything else fails this tenant's child rather than
    # being read leniently, because a near-miss here silently means the
    # opposite of what was intended.
    #
    # NOTE: not enforceable yet. template-operator-v2 deletes rendered
    # resources unconditionally (TOV2-1), so "false" documents intent only.
    argocd.tenantoperator.stakater.com/on-delete-purge: "false"

spec:
  quota: small

  accessControl:
    # ---------------------------------------------------- groups vs users
    #
    # Both end up in the AppProject's roles[].groups, in this order:
    #
    #   1. <tenant>-<role>-group-<hash>   generated by MTO
    #   2. the IntegrationConfig's privileged groups
    #   3. the groups listed here
    #   4. the users listed here
    #
    # Entry 1 only exists if MTO actually created it, which happens only when
    # the tenant-operator runs with PLATFORM_TYPE=Openshift. That is an
    # environment variable, not a detected value, and it is wrong on at least
    # one of our OpenShift clusters -- where the generated group is therefore
    # absent and any tenant relying on it alone has an AppProject that grants
    # nothing.
    #
    # So: list real groups from your identity provider, and list users too.
    # Entries 3 and 4 resolve regardless of platform.
    owners:
      groups:
        - acme-platform-admins      # must exist in your IdP / as an OpenShift Group
      users:
        - alice@acme.example
    editors:
      groups:
        - acme-developers
    viewers:
      groups:
        - acme-readonly

  namespaces:
    withTenantPrefix:
      - dev
      - prod

# Namespaces excluded from the AppProject's destinations are those matching
# IntegrationConfig .spec.accessControl.privileged.namespaces. That match is an
# UNANCHORED regex, so a pattern of `openshift` also excludes a namespace
# called `my-openshift-tools`. Check the patterns before assuming a namespace
# will be reachable.
