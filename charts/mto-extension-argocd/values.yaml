# Namespace holding this chart's template-operator-v2 objects: the two
# Templates, the parent TemplateInstance, and every child TemplateInstance the
# parent renders.
#
# Nothing requires this to be any particular namespace. templateRef carries an
# explicit namespace and template-operator-v2 resolves it cross-namespace, and
# the three other namespaces in play are separate values: where the operator
# itself runs (rbac.serviceAccount.namespace), where the IntegrationConfig
# lives (integrationConfig.namespace), and where the AppProjects go
# (argocd.namespace).
#
# It defaults to multi-tenant-operator only because that namespace is already
# a prerequisite -- the IntegrationConfig is there -- and this chart creates no
# namespace, so pointing it somewhere new fails the install unless you create
# that namespace first.
#
# One release per cluster. The Template and RBAC names are fixed
# (mto-argocd-parent, mto-argocd-child, and mto-extension-argocd-observe,
# -write, -children and -integrationconfig-read), so a second release fails
# with "invalid ownership metadata" -- and even in different
# operatorNamespaces, both releases would read the same singleton
# IntegrationConfig.
operatorNamespace: multi-tenant-operator

argocd:
  # REQUIRED, and enforced by values.schema.json with minLength 1.
  #
  # The namespace ArgoCD runs in. Every AppProject is created here, and it is
  # always present in every tenant's destinations, including when it
  # matches a privileged pattern.
  #
  # A blank value does NOT render zero children -- $argoNs never gates emission.
  # It renders one child per tenant, each producing an AppProject with an empty
  # namespace, which the API server rejects. Every tenant breaks at once. The
  # schema's minLength catches a typo at install time, and _helpers.tpl repeats
  # the check for the render paths that skip the schema; do not relax either.
  # Formerly read from IntegrationConfig .spec.integrations.argocd
  # .namespace, which is deprecated.
  namespace: ""

  # Whether the ArgoCD namespace is a destination of every tenant's AppProject.
  #
  # false (the default, and the safe value): it never is -- not appended, and
  # not kept even when the namespace carries a tenant's label. An Application in
  # the control-plane namespace may reference ANY AppProject, and the
  # application controller that syncs into it is cluster-admin, so a tenant
  # that can deploy there can create Applications, AppProjects or repository
  # and cluster Secrets for every project: ArgoCD admin. See #6 and
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/app-any-namespace/
  #
  # true: the legacy ExtensionsArgoCDReconciler output, exactly -- appended for
  # every tenant, even when it matches a privileged pattern. UNSAFE. Only for a
  # migration that must first reproduce the old AppProjects; move tenants'
  # Applications out of the control plane (sourceNamespaces) and set it back.
  allowControlPlaneDestination: false

  # Applications in the tenant's own namespace (#9). When enabled, every
  # AppProject gets sourceNamespaces: [<pattern>], so the tenant creates its
  # Applications and ApplicationSets there instead of in the control plane.
  #
  # Two gates, and this is only the second: ArgoCD must also watch the
  # namespace -- `application.namespaces` in argocd-cmd-params-cm (upstream) or
  # ArgoCD.spec.sourceNamespaces (OpenShift GitOps 1.13+). See README,
  # "Applications in the tenant's own namespace".
  #
  # A dedicated namespace, not every tenant namespace: on OpenShift GitOps a
  # namespace cannot be both managed-by and a source namespace without custom
  # roles. The namespace itself comes from the Multi-Tenant Operator (for
  # example namespaces.withTenantPrefix: [argocd]); this chart only writes the
  # AppProject. A pattern that expands to the ArgoCD namespace or to a
  # privileged namespace fails that tenant.
  sourceNamespaces:
    enabled: false
    pattern: "{{ tenant }}-argocd"

  # Cluster-scoped kinds every tenant's AppProject may manage. Global default;
  # a Tenant may override it with the cluster-resource-whitelist annotation.
  # Empty here and absent on the Tenant means the field is omitted from the
  # AppProject entirely -- which ArgoCD reads as "no cluster-scoped resources".
  #
  # Formerly IntegrationConfig .spec.integrations.argocd.clusterResourceWhitelist
  # (deprecated). On an existing cluster, seed this from the live
  # IntegrationConfig or every tenant's AppProject silently loses the list.
  clusterResourceWhitelist: []
  #  - group: ""
  #    kind: Namespace

  # Namespaced kinds every tenant's AppProject may NOT manage. Same override and
  # seeding rules as clusterResourceWhitelist.
  namespaceResourceBlacklist: []
  #  - group: ""
  #    kind: ResourceQuota

  sourceRepos:
    # Git repositories a tenant's Applications may deploy from. There is no safe
    # shared default: one org-wide value lets every tenant deploy from every
    # other tenant's repos, so the only shareable form is a per-tenant pattern.
    #
    # A list. Each entry becomes one sourceRepos entry, in order, with
    # `{{ tenant }}` expanded to the tenant's name. An entry with no
    # placeholder is simply a literal, which is why no separate `literal:` key
    # exists yet.
    #
    #   pattern:
    #     - https://github.com/acme/{{ tenant }}-gitops
    #     - https://github.com/acme/{{ tenant }}-charts
    #
    # Ships EMPTY on purpose: a shipped default would add a field to every
    # existing AppProject that did not have one and break the migration diff
    # against the old controller's output. A Tenant may override with the
    # source-repos annotation.
    pattern: []

# The three project roles (<tenant>-owner, -edit, -view).
roles:
  # leastPrivilege | extensionsCompatible
  #
  #   leastPrivilege        the default (#7):
  #                           owner  applications *, applicationsets *, logs get,
  #                                  repositories *, clusters get
  #                           edit   applications get, sync, update, update/*,
  #                                  action/*; applicationsets, logs,
  #                                  repositories, clusters get
  #                           view   get on all five
  #                         Edit cannot create, delete or override Applications.
  #   extensionsCompatible  the legacy ExtensionsArgoCDReconciler shape: `*` on
  #                         all six project resources for owner AND edit
  #                         (exec and cluster writes included), `get` for view.
  #                         Only for a migration that must first match the old
  #                         AppProjects.
  profile: leastPrivilege
  # ArgoCD's web terminal runs as the argocd-server ServiceAccount, not as the
  # user -- outside the tenant's own RBAC and audit trail. Off by default; when
  # on, owner only, and ArgoCD itself also needs exec.enabled in argocd-cm.
  # Ignored by extensionsCompatible.
  exec:
    enabled: false
  # Registering project-scoped clusters. Off by default (owner gets clusters
  # get); when on, owner gets clusters *. Ignored by extensionsCompatible.
  clusters:
    enabled: false

# Which Tenants get an AppProject.
scaffolding:
  # Always | OnLabel | OnAnnotation | Never
  #
  # Defaults to OnAnnotation so that installing the chart does nothing until a
  # Tenant is explicitly opted in. This is the replacement for creating an
  # Extensions CR: same decision, different home.
  #
  # Changing this value to a narrower mode reaps the children it excludes. What
  # that does to their AppProjects depends on onDeletePurgeAppProject and on the
  # operator build -- released and kept, or deleted outright. See the note on
  # onDeletePurgeAppProject below. Treat a change here as a delete until you
  # have confirmed otherwise on your own cluster.
  mode: OnAnnotation

  # The annotation key checked in OnAnnotation mode. Only the key is
  # configurable; the expected value is always exactly "true".
  annotations:
    enabled: argocd.tenantoperator.stakater.com/enabled

  # The label key checked in OnLabel mode.
  labels:
    enabled: argocd.tenantoperator.stakater.com/enabled

# Annotation keys read off each Tenant for the four per-tenant overrides.
# Absent annotation inherits the chart default above; an explicit `[]`
# overrides with empty. Malformed JSON -- and an explicit empty string, the
# near-miss of `[]` -- fails that tenant's child rather than falling back:
# applies are server-side, so a silent fallback would strip the field from a
# live AppProject.
annotations:
  sourceRepos: argocd.tenantoperator.stakater.com/source-repos
  clusterResourceWhitelist: argocd.tenantoperator.stakater.com/cluster-resource-whitelist
  namespaceResourceBlacklist: argocd.tenantoperator.stakater.com/namespace-resource-blacklist
  onDeletePurge: argocd.tenantoperator.stakater.com/on-delete-purge

# The IntegrationConfig the parent reads. Supplies accessControl.privileged
# only -- privileged namespaces (excluded from every tenant's destinations) and
# privileged groups (added to every role). Those are core MTO config with five
# non-ArgoCD consumers, so they are NOT part of the integrations.argocd
# deprecation.
#
# This parameter deliberately carries no defaultValue. Masking a failed read
# would yield an empty privileged list, putting privileged namespaces into
# tenants' destinations -- cross-tenant exposure. Failing the parent is
# fail-closed, and matches MTO's own [".*"] fallback.
integrationConfig:
  name: tenant-operator-config
  namespace: multi-tenant-operator

# The label a Namespace carries to belong to a tenant.
tenantNamespaceLabel: stakater.com/tenant

# Drift repair on rendered AppProjects.
sync:
  # off | revert | strict
  #
  #   off     created once, never enforced
  #   revert  the controller reverts external edits back to the rendered state
  #   strict  revert, PLUS an admission webhook that refuses UPDATE and DELETE
  #           on rendered AppProjects outright
  #
  # Defaults to `strict`, and the difference is not cosmetic. Under `revert`,
  # deleting a rendered AppProject wedges it: template-operator-v2's finalizer
  # is never released, its drift check reports "No drift detected" because the
  # spec still matches, and the owning TemplateInstance goes on reporting
  # Ready=True while ArgoCD refuses to use a Terminating project. Reproduced on
  # a live cluster.
  #
  # Under `strict` the delete is simply denied:
  #
  #   Error from server (Forbidden): admission webhook
  #   "sync-enforcement.templates.v2.stakater.com" denied the request: resource
  #   is managed by sync-enabled TemplateInstance ...; deletion is not allowed
  #
  # Teardown is not blocked by the webhook: it allows the delete once the
  # owning TemplateInstance is itself being deleted, so descaffolding a tenant
  # and uninstalling are both permitted -- verified on the same cluster.
  #
  # Two costs, both real:
  #
  #  1. Nobody can hand-edit or delete a managed AppProject any more, including
  #     you. That is drift protection working as intended, but it is stricter
  #     than ExtensionsArgoCDReconciler, which let an edit through and
  #     reconciled it away afterwards. To intervene: fix the Tenant annotation
  #     or the chart values, or `helm upgrade --set sync.mode=revert`, fix, and
  #     set it back.
  #
  #  2. Enforcement depends on template-operator-v2's webhook being reachable.
  #     Its failurePolicy is Fail, so while the operator is down, updates and
  #     deletes to resources it MANAGES are rejected.
  #
  #     The blast radius is supposed to stop there, and does so ONLY IF that
  #     webhook carries its matchConditions CEL filter on the
  #     `templates.v2.stakater.com/instance` label. CHECK THAT IT DOES:
  #
  #       kubectl get validatingwebhookconfiguration \
  #         -o jsonpath='{.items[*].webhooks[?(@.name=="sync-enforcement.templates.v2.stakater.com")].matchConditions}'
  #
  #     Empty output means the webhook matches UPDATE and DELETE on every
  #     resource in the cluster and fails closed -- which takes the whole
  #     control plane down with it the moment the operator is unreachable,
  #     kube-controller-manager's leader-election Lease included, and does not
  #     self-heal. It is not hypothetical: helmify drops matchConditions when
  #     generating tov2's chart, and only a release-time postprocess step puts
  #     it back. The published chart (checked at 0.0.6) HAS it; a chart built
  #     from a tov2 checkout does not. Measured on a fresh cluster; see
  #     hack/e2e/scope-tov2-webhook.sh for the one-command repair.
  #
  # ArgoCD writing AppProject status is NOT blocked: `status` is in
  # template-operator-v2's ServerManagedFields and always stripped before
  # comparison.
  mode: strict

  # Both exemptions are load-bearing under `strict`. Removing either breaks
  # something that is not drift.
  ignoreFields:
    # template-operator-v2 manages its own finalizer on the AppProject through
    # an ordinary UPDATE. Without this the webhook locks the operator out of
    # its own object and nothing can ever be torn down.
    - metadata.finalizers

    # ArgoCD writes project role tokens into the SPEC -- `argocd proj role
    # create-token <proj> <role>`, the normal way to mint a token for a CI
    # pipeline, appends to spec.roles[].jwtTokens. status.jwtTokensByRole is
    # only a mirror, and status is stripped automatically; the spec field is
    # not. Without this exemption strict denies a supported ArgoCD workflow.
    #
    # Exempting it is safe: this chart never renders jwtTokens. The next
    # re-render does remove this spec copy -- `roles` is one atomic list, so
    # the apply replaces it whole -- but the token stays valid: ArgoCD checks
    # project tokens against status.jwtTokensByRole, which template-operator-v2
    # never touches. Verified on ArgoCD 3.4.6, revocation included.
    - spec.roles[*].jwtTokens

# Default for whether deleting a Tenant (or descaffolding it) deletes its
# AppProject. False means retain. Overridable per Tenant with the
# on-delete-purge annotation.
#
# NOTE: whether retain is enforced depends on the template-operator-v2 build
# underneath. The chart's part is the same either way -- it stamps
# templates.v2.stakater.com/deletion-policy: Orphan on every AppProject it
# renders with purge disabled.
#
#   v0.0.7 and later   honoured. Descaffolding RELEASES the AppProject:
#                      the object stays, and comes back with no finalizer and
#                      no ownership labels, so a human can delete it.
#   v0.0.6 and earlier  ignored. Every rendered resource is deleted
#                      unconditionally on child deletion, so here the
#                      value documents intent only.
#
# `make e2e-kind` reports which of the two your operator does.
onDeletePurgeAppProject: false

rbac:
  # Create the ClusterRoles/Bindings that let template-operator-v2 manage
  # AppProjects. Turn off only if you bind them yourself.
  create: true
  # The ServiceAccount template-operator-v2 runs as.
  serviceAccount:
    name: template-operator-v2
    namespace: stakater-template-operator
