apiVersion: v2
name: mto-extension-argocd
# The template-operator-v2 versions in this description are the single source
# of truth. README.md, values.yaml, templates/ and docs/ must match them.
description: |
  Per-tenant ArgoCD AppProjects for Multi Tenant Operator, rendered by
  template-operator-v2 instead of a Go controller. Installs a parent Template
  that ranges over Tenant CRs and emits one child TemplateInstance per tenant,
  the child Template that renders that tenant's AppProject, and the RBAC
  template-operator-v2 needs to manage AppProjects in the ArgoCD namespace.

  Replaces ExtensionsArgoCDReconciler and the Extensions CRD in
  multi-tenant-operator.

  Requires: multi-tenant-operator (Tenant v1beta3 + IntegrationConfig v1beta1),
  template-operator-v2 >= 0.0.5, and ArgoCD (argoproj.io/v1alpha1 AppProject)
  installed. sync.mode=strict (the default) needs the template-operator-v2 sync
  webhook, shipped since 0.0.3; on OpenShift without cert-manager it needs
  >= 0.0.6. onDeletePurgeAppProject=false (the default) retains AppProjects
  only on >= 0.0.7. On 0.0.6 and earlier the AppProject of every tenant that
  stops being rendered is DELETED: removing a tenant's opt-in, narrowing
  scaffolding.mode or deleting the Tenant deletes the AppProjects of those
  tenants, and helm uninstall deletes all of them.
type: application
version: 0.7.0
appVersion: "0.7.0"
keywords:
  - argocd
  - multi-tenant-operator
  - template-operator-v2
home: https://github.com/stakater-ab/mto-extension-argocd
sources:
  - https://github.com/stakater-ab/mto-extension-argocd
